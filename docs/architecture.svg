<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#334155; stroke-width:1.5; rx:8; }
      .art { fill:#eef2ff; stroke:#6366f1; stroke-width:1.5; rx:8; }
      .gate { fill:#fef2f2; stroke:#b91c1c; stroke-width:2.5; rx:8; }
      .cross { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.2; stroke-dasharray:4 3; rx:8; }
      .t  { font-size:14px; fill:#0f172a; }
      .tb { font-size:14px; fill:#0f172a; font-weight:700; }
      .ts { font-size:11px; fill:#475569; }
      .tw { font-size:12px; fill:#ffffff; font-weight:700; }
      .edge { stroke:#334155; stroke-width:1.6; fill:none; }
      .edgeR{ stroke:#b91c1c; stroke-width:1.8; fill:none; }
    </style>
  </defs>

  <!-- Solid background so text outside the boxes stays readable on GitHub's dark theme too -->
  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">NL Insights Engine — the LLM proposes, deterministic code disposes</text>
  <text x="24" y="56" class="ts">One invariant: there is no path from a question to executed SQL that does not pass the binder.</text>

  <!-- Ingest lane -->
  <text x="24" y="92" class="tb">Ingest time — understanding is built once and frozen</text>

  <rect x="24" y="104" width="96" height="52" class="box"/>
  <text x="72" y="128" text-anchor="middle" class="tb">CSV</text>
  <text x="72" y="145" text-anchor="middle" class="ts">any unseen file</text>

  <rect x="156" y="104" width="150" height="52" class="box"/>
  <text x="231" y="126" text-anchor="middle" class="tb">ingestion</text>
  <text x="231" y="144" text-anchor="middle" class="ts">sniff · type · profile</text>

  <rect x="342" y="104" width="120" height="52" class="art"/>
  <text x="402" y="126" text-anchor="middle" class="tb">Profile</text>
  <text x="402" y="144" text-anchor="middle" class="ts">evidence + FDs</text>

  <rect x="498" y="90" width="230" height="80" class="box"/>
  <text x="613" y="110" text-anchor="middle" class="tb">semantic</text>
  <text x="613" y="128" text-anchor="middle" class="ts">propose (LLM | heuristic)</text>
  <text x="613" y="144" text-anchor="middle" class="ts">→ verify → discover → measures</text>
  <text x="613" y="160" text-anchor="middle" class="ts">code disposes: refuted claims dropped</text>

  <rect x="762" y="104" width="254" height="52" class="art"/>
  <text x="889" y="126" text-anchor="middle" class="tb">SemanticModel</text>
  <text x="889" y="144" text-anchor="middle" class="ts">bindings + confidence + provenance</text>

  <path class="edge" d="M120 130 H156" marker-end="url(#arrow)"/>
  <path class="edge" d="M306 130 H342" marker-end="url(#arrow)"/>
  <path class="edge" d="M462 130 H498" marker-end="url(#arrow)"/>
  <path class="edge" d="M728 130 H762" marker-end="url(#arrow)"/>

  <!-- Query lane -->
  <text x="24" y="228" class="tb">Query time — a cheap typed lookup against the frozen model</text>

  <rect x="24" y="240" width="120" height="52" class="box"/>
  <text x="84" y="264" text-anchor="middle" class="tb">question</text>
  <text x="84" y="281" text-anchor="middle" class="ts">natural language</text>

  <rect x="180" y="240" width="150" height="52" class="box"/>
  <text x="255" y="262" text-anchor="middle" class="tb">interpreter</text>
  <text x="255" y="280" text-anchor="middle" class="ts">NL → typed plan</text>

  <rect x="366" y="240" width="110" height="52" class="art"/>
  <text x="421" y="262" text-anchor="middle" class="tb">QueryIR</text>
  <text x="421" y="280" text-anchor="middle" class="ts">never SQL</text>

  <!-- the gate -->
  <rect x="512" y="232" width="150" height="68" class="gate"/>
  <text x="587" y="258" text-anchor="middle" class="tb" fill="#b91c1c">binder</text>
  <text x="587" y="276" text-anchor="middle" class="ts">the refusal spine</text>
  <text x="587" y="291" text-anchor="middle" class="ts">detectors carry evidence</text>

  <path class="edge" d="M144 266 H180" marker-end="url(#arrow)"/>
  <path class="edge" d="M330 266 H366" marker-end="url(#arrow)"/>
  <path class="edge" d="M476 266 H512" marker-end="url(#arrow)"/>

  <!-- model feeds binder -->
  <path class="edge" d="M889 156 V200 H587 V232" marker-end="url(#arrow)"/>
  <text x="600" y="196" class="ts">the model is the only thing the binder trusts</text>

  <!-- refuse branch -->
  <rect x="487" y="330" width="200" height="46" class="box"/>
  <text x="587" y="352" text-anchor="middle" class="tb">REFUSE / CLARIFY</text>
  <text x="587" y="368" text-anchor="middle" class="ts">no SQL runs · evidence attached</text>
  <path class="edgeR" d="M587 300 V330" marker-end="url(#arrowRed)"/>

  <!-- answer branch -->
  <rect x="712" y="240" width="130" height="52" class="box"/>
  <text x="777" y="262" text-anchor="middle" class="tb">executor</text>
  <text x="777" y="280" text-anchor="middle" class="ts">bound plan → SQL</text>

  <rect x="712" y="330" width="304" height="52" class="art"/>
  <text x="864" y="352" text-anchor="middle" class="tb">Answer</text>
  <text x="864" y="370" text-anchor="middle" class="ts">rows + SQL + explanation + caveats</text>

  <path class="edge" d="M662 266 H712" marker-end="url(#arrow)"/>
  <text x="668" y="258" class="ts">bound</text>
  <path class="edge" d="M777 292 V330" marker-end="url(#arrow)"/>

  <!-- cross-cutting -->
  <text x="24" y="430" class="tb">Cross-cutting</text>
  <rect x="24" y="442" width="216" height="60" class="cross"/>
  <text x="132" y="464" text-anchor="middle" class="tb">jobs</text>
  <text x="132" y="481" text-anchor="middle" class="ts">async submit · SSE stages</text>
  <text x="132" y="496" text-anchor="middle" class="ts">atomic promote · idempotent · cancel</text>

  <rect x="256" y="442" width="200" height="60" class="cross"/>
  <text x="356" y="464" text-anchor="middle" class="tb">provider</text>
  <text x="356" y="481" text-anchor="middle" class="ts">one seam · replay | apikey | ambient</text>
  <text x="356" y="496" text-anchor="middle" class="ts">record → replay, no credentials</text>

  <rect x="472" y="442" width="190" height="60" class="cross"/>
  <text x="567" y="464" text-anchor="middle" class="tb">api</text>
  <text x="567" y="481" text-anchor="middle" class="ts">thin HTTP adapter</text>
  <text x="567" y="496" text-anchor="middle" class="ts">shaped errors, no stack traces</text>

  <rect x="678" y="442" width="338" height="60" class="cross"/>
  <text x="847" y="464" text-anchor="middle" class="tb">eval</text>
  <text x="847" y="481" text-anchor="middle" class="ts">golden suites · confusion matrix · false-answer rate</text>
  <text x="847" y="496" text-anchor="middle" class="ts">metamorphic ablation · anti-hardcoding lint</text>

  <text x="24" y="548" class="ts">Answers disclose their scope: net-of-returns; and exactly how much non-product money a bare total contains (quantified).</text>
  <text x="24" y="566" class="ts">The same file yields different, correct models by the evidence it carries — postage is excluded where a line-type column exists, included where it does not.</text>
  <text x="24" y="584" class="ts">The LLM improves proposal quality; it is not load-bearing — the heuristic proposer runs the whole pipeline with zero credentials.</text>
</svg>
