name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      # Hermetic: the default provider is replay, so the whole suite runs with no
      # ANTHROPIC_API_KEY and no network. A cache miss fails loudly rather than
      # silently calling out.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
